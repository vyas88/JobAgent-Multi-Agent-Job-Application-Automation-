name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          # Dummy values — no real credentials in CI.
          DATABASE_URL: "postgresql://test:test@localhost:5432/jobagent_test"
          OPENAI_API_KEY: "sk-test-not-a-real-key"
          PLAYWRIGHT_SERVICE_URL: "http://localhost:8000"
        run: |
          pytest --cov=src --cov-report=term-missing -v

      - name: Check for hardcoded secrets
        run: |
          # Fail if any real-looking API key pattern appears in tracked files.
          # This is a basic guard; not a replacement for proper secret scanning.
          if git grep -lP 'sk-[a-zA-Z0-9]{20,}' -- '*.py' '*.toml' '*.yml' '*.yaml' '*.json' | grep -v '.env.example' | grep -v 'test_'; then
            echo "ERROR: Possible hardcoded secret found!"
            exit 1
          fi
          echo "No hardcoded secrets detected."
